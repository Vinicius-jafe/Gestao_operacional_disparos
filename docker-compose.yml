services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_disparos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-disparos_emive}
      POSTGRES_USER: ${POSTGRES_USER:-admin_emive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo  # <-- Fuso Horário Brasil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin_emive} -d ${POSTGRES_DB:-disparos_emive}"]
      interval: 5s
      timeout: 5s
      retries: 5

  painel-disparos:
    build: .
    container_name: painel_disparos_web
    restart: unless-stopped
    command: streamlit run src/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      TZ: America/Sao_Paulo  # <-- Fuso Horário Brasil
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./dados:/app/dados
    depends_on:
      postgres-db:
        condition: service_healthy

  coletor-horario:
    build: .
    container_name: coletor_disparos_worker
    restart: unless-stopped
    command: python -m src.collector
    environment:
      TZ: America/Sao_Paulo  # <-- Fuso Horário Brasil
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data: